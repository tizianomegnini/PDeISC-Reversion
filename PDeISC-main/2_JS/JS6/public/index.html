<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahorcado PRO</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/styles/style.css">
</head>

<body>

<div class="app-shell">

    <!-- Header -->
    <header class="app-header d-flex align-items-center justify-content-between">
        <h1 class="app-title mb-0">🌎 Ahorcado</h1>
        <button id="toggleTema" class="btn btn-icon" type="button" aria-label="Cambiar tema">🌙</button>
    </header>

    <!-- Contenido principal -->
    <main class="app-main">
        <div class="container-fluid h-100">
            <div class="row g-3 h-100">

                <!-- Columna del juego -->
                <section class="col-12 col-lg-8 d-flex">
                    <div class="panel panel-game d-flex flex-column w-100">

                        <div class="text-center">
                            <h2 id="palabra-display" class="palabra">Cargando...</h2>

                            <div class="d-flex justify-content-center align-items-center gap-3 mt-2 flex-wrap">
                                <span class="badge-intentos">
                                    Intentos: <strong id="intentos">6</strong>
                                </span>
                                <p id="mensaje" class="mensaje mb-0"></p>
                            </div>
                        </div>

                        <!-- Nombre -->
                        <div id="nombre-container" class="nombre-container d-none">
                            <input type="text" id="nombre" placeholder="Tu nombre" class="form-control mx-auto" style="max-width: 320px;">
                            <button onclick="guardarScore()" class="btn btn-success mt-2">Guardar puntaje</button>
                        </div>

                        <!-- Teclado -->
                        <div id="teclado" class="teclado mt-auto"></div>

                        <!-- Controles -->
                        <div class="text-center mt-4">
                            <button onclick="iniciarJuego()" class="btn btn-warning btn-lg">🔄 Reiniciar</button>
                        </div>

                    </div>
                </section>

                <!-- Columna del ranking -->
                <aside class="col-12 col-lg-4 d-flex">
                    <div class="panel panel-ranking w-100">
                        <h3 class="ranking-title">🏆 Ranking TOP 5</h3>
                        <ul id="ranking" class="list-group ranking-list"></ul>
                    </div>
                </aside>

            </div>
        </div>
    </main>

</div>

<script src="/scripts/app.js"></script>
<script>
    // Manejo de tema claro/oscuro con persistencia
    (function () {
        const root = document.documentElement;
        const btn = document.getElementById('toggleTema');
        const guardado = localStorage.getItem('tema');
        const inicial = guardado || 'dark';

        aplicarTema(inicial);

        btn.addEventListener('click', function () {
            const actual = root.getAttribute('data-bs-theme');
            const nuevo = actual === 'dark' ? 'light' : 'dark';
            aplicarTema(nuevo);
            localStorage.setItem('tema', nuevo);
        });

        function aplicarTema(tema) {
            root.setAttribute('data-bs-theme', tema);
            btn.textContent = tema === 'dark' ? '🌙' : '☀️';
        }
    })();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</body>
</html>
