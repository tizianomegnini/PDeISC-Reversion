<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"> 
  <title>Empresa X - RRHH Mobile</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

  <style>
    body { background-color: #0b0e14; overflow-x: hidden; }

    .employee-card { 
      background: #161c2d; 
      border-left: 4px solid #0d6efd; 
      font-size: 0.85rem; 
      margin-bottom: 10px;
    }

    .data-label { 
      color: #6c757d; 
      font-weight: 700; 
      text-transform: uppercase; 
      font-size: 0.65rem; 
    }

    @media (max-width: 576px) {
      .container-fluid { padding: 15px; }
      h2 { font-size: 1.5rem; }
    }
  /* Solo mantén los estilos visuales necesarios */
  .card { border-radius: 1rem; border: 1px solid var(--bs-border-color); }
  .prod-card { transition: transform 0.2s; }
  .prod-card:hover { transform: translateY(-5px); }
  /* Esto asegura que el fondo cambie correctamente */
  body { background-color: var(--bs-body-bg); }
</style>
</head>

<body class="p-2 p-md-4">

  <div class="container-fluid">

    <div class="row border-bottom border-secondary mb-4 pb-2">
      <div class="col text-center text-md-start">
        <h2 class="fw-bold m-0 text-uppercase tracking-tighter">Empresa</h2>
      </div>
    </div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">Apex<span class="text-success">Banking</span></h5>
        <button id="themeBtn" class="btn btn-sm btn-theme">🌓 Modo</button>
      </div>
    <div class="row g-4">

      <!-- FORMULARIO -->
      <div class="col-12 col-xl-4">

        <form id="formEmpresa" class="bg-dark p-3 p-md-4 border border-secondary shadow-sm" novalidate>

          <h5 class="text-white mb-3 text-center text-md-start small fw-bold">
            NUEVO REGISTRO
          </h5>

          <div class="row g-2">

            <div class="col-6">
              <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Nombre" required>
            </div>

            <div class="col-6">
              <input type="text" id="apellido" name="apellido" class="form-control" placeholder="Apellido" required>
            </div>

            <div class="col-4">
              <input type="number" id="edad" name="edad" class="form-control" placeholder="Edad" required min="18">
            </div>

            <div class="col-8">
              <input type="date" name="nacimiento" class="form-control" required>
            </div>

            <div class="col-6">
              <select name="sexo" class="form-select" required>
                <option value="" disabled selected>Sexo</option>
                <option value="Masculino">Masculino</option>
                <option value="Femenino">Femenino</option>
              </select>
            </div>

            <div class="col-6">
              <input type="text" id="dni" name="dni" class="form-control" placeholder="DNI" required maxlength="8">
            </div>

            <div class="col-12">
              <input type="text" id="cuit" name="cuit" class="form-control" placeholder="CUIT (11 dígitos)" required maxlength="11">
            </div>

            <div class="col-6">
              <select name="estadocivil" class="form-select" required>
                <option value="" disabled selected>Est. Civil</option>
                <option value="soltero">Soltero/a</option>
                <option value="casado">Casado/a</option>
                <option value="viudo">Viudo/a</option>
              </select>
            </div>

            <div class="col-6">
              <input type="text" id="nacionalidad" name="nacionalidad" class="form-control" placeholder="Nacionalidad" required>
            </div>

            <div class="col-6">
              <input type="tel" id="tel" name="telefono" class="form-control" placeholder="Teléfono" required>
            </div>

            <div class="col-6">
              <input type="email" id="mail" name="mail" class="form-control" placeholder="Email" required>
            </div>

            <div class="col-12">
              <div class="p-2 border border-secondary text-center bg-black rounded">

                <label class="small text-secondary d-block mb-1">
                  ¿TIENE HIJOS?
                </label>

                <div class="d-flex justify-content-center gap-4">

                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="hijos" id="h-si" value="Si" required>
                    <label>Sí</label>
                  </div>

                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="hijos" id="h-no" value="No" checked required>
                    <label>No</label>
                  </div>

                </div>

              </div>
            </div>

            <div class="col-12" id="inputCantHijos" style="display: none;">
              <input type="number" name="cantidadHijos" id="cantHijos" class="form-control" placeholder="¿Cuántos?" value="0">
            </div>

            <div class="col-12">
              <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
                GUARDAR EMPLEADO
              </button>
            </div>

          </div>
        </form>
      </div>

      <!-- LISTA -->
      <div class="col-12 col-xl-8">

        <div class="d-flex justify-content-between mb-3 align-items-center">
          <h6 class="fw-bold m-0 text-secondary small">LISTA DE PERSONAL</h6>
          <span id="total" class="badge bg-primary">0</span>
        </div>

        <div id="listaEmpleados" class="row g-2">
        </div>

      </div>

    </div>
  </div>

  <script src="/scripts/app.js"></script>

</body>
</html>
