<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto 5 - Inyección Unificada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles/style.css">
</head>
<body class="bg-body-tertiary text-body">

    <div class="container py-4 py-md-5" style="max-width: 1000px;">
        
        <header class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3 mb-4 pb-3 border-bottom">
            <div class="text-center text-sm-start">
                <span class="badge bg-secondary-subtle text-secondary-emphasis mb-1">Método: innerHTML</span>
                <h1 class="fw-bold h2 m-0">Inyector de Objetos Armónicos</h1>
                <p class="text-body-secondary small m-0">Consigna 5: Renderizado dinámico con paleta de colores unificada y reactiva.</p>
            </div>
            <button id="theme-toggle" class="btn btn-outline-secondary px-3 fw-bold shadow-sm d-flex align-items-center gap-2">
                <span id="theme-icon">🌙</span> <span id="theme-text">Modo Oscuro</span>
            </button>
        </header>

        <div class="row g-4">
            
            <div class="col-12 col-md-5">
                <div class="card shadow-sm p-3 p-sm-4 position-sticky" style="top: 20px;">
                    <h5 class="fw-bold mb-3 text-body-secondary border-bottom pb-2 fs-6 text-uppercase">🎛️ Componentes</h5>
                    <div class="d-flex flex-column gap-2">
                        <button class="btn btn-outline-secondary text-start py-2.5 fw-medium btn-inject" data-object="card">
                            🪪 Vista de Usuario (Card)
                        </button>
                        <button class="btn btn-outline-secondary text-start py-2.5 fw-medium btn-inject" data-object="alert">
                            ⚠️ Banner Informativo (Alert)
                        </button>
                        <button class="btn btn-outline-secondary text-start py-2.5 fw-medium btn-inject" data-object="progress">
                            📊 Métrica de Carga (Progress)
                        </button>
                        <button class="btn btn-outline-secondary text-start py-2.5 fw-medium btn-inject" data-object="table">
                            📅 Tabla Dinámica (Table)
                        </button>
                        <button class="btn btn-outline-secondary text-start py-2.5 fw-medium btn-inject" data-object="badge-list">
                            🏷️ Grupo de Etiquetas (Badges)
                        </button>
                    </div>
                    <button id="btn-clear-dom" class="btn btn-secondary btn-sm mt-4 fw-bold shadow-sm w-100">
                        🗑️ Limpiar Historial de Inyección
                    </button>
                </div>
            </div>

            <div class="col-12 col-md-7">
                <div class="card shadow-sm p-3 p-sm-4 mb-4" style="min-height: 220px;">
                    <h5 class="fw-bold mb-3 text-secondary fs-6 text-uppercase border-bottom pb-2">🖼️ Espacio del DOM Real</h5>
                    <div id="injection-zone" class="d-flex flex-column gap-3">
                        <div id="empty-placeholder" class="text-body-secondary small text-center my-auto py-5">
                            Zona vacía. Presioná un componente para estamparlo de manera fluida.
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm p-3 p-sm-4 bg-dark text-light border-0">
                    <h5 class="fw-bold mb-3 text-secondary font-monospace fs-6 text-uppercase border-bottom border-secondary pb-2">📋 Código HTML Inyectado</h5>
                    <div id="log-container" class="font-monospace small style-scroll" style="height: 180px; overflow-y: auto;">
                        <span class="text-muted italic">> Esperando flujos...</span>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <button id="btn-back-to-top" class="btn btn-secondary position-fixed bottom-0 end-0 m-3 m-md-4 shadow rounded-circle d-flex align-items-center justify-content-center" style="width: 45px; height: 45px; z-index: 1050;" aria-label="Volver arriba">
        ▲
    </button>
    <script src="/scripts/script.js"></script>
</body>
</html>
