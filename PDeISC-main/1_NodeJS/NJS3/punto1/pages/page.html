<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Punto 1 - Dashboard DOM</title>
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body class="bg-body-tertiary min-vh-100 d-flex flex-column">

    <!-- Barra superior minimalista -->
    <header class="p-3 border-bottom d-flex justify-content-between align-items-center bg-body-surface">
        <span class="fw-bold tracking-wider text-uppercase fs-6 text-secondary">Laboratorio DOM</span>
        <button id="toggleTema" class="btn btn-outline-secondary btn-sm" onclick="toggleTema()">
            ☀️ Modo Claro
        </button>
    </header>

    <!-- Contenedor Principal (Ocupa todo el ancho sin márgenes exagerados) -->
    <div class="container-fluid flex-grow-1 p-3">
        <div class="row g-3 h-100-custom">
            
            <!-- COLUMNA IZQUIERDA: Panel de Controles/Botones -->
            <div class="col-12 col-md-4 col-lg-3">
                <div class="card p-3 h-100 border-0 shadow-sm bg-body">
                    <p class="text-muted small fw-bold text-uppercase mb-3">Acciones disponibles</p>
                    <div class="d-flex flex-column gap-2">
                        <button id="btnAgregarH1" class="btn btn-primary py-2.5 fw-semibold text-start" onclick="agregarH1()">
                            📝 Agregar H1
                        </button>
                        <button class="btn btn-warning py-2.5 fw-semibold text-dark text-start" onclick="cambiarTexto()">
                            🔄 Cambiar Texto
                        </button>
                        <button class="btn btn-danger py-2.5 fw-semibold text-start" onclick="cambiarColor()">
                            🎨 Cambiar Color
                        </button>
                        <button id="btnAgregarImagen" class="btn btn-success py-2.5 fw-semibold text-start" onclick="agregarImagen()">
                            🖼️ Agregar Imagen
                        </button>
                        <button class="btn btn-info py-2.5 fw-semibold text-dark text-start" onclick="cambiarImagen()">
                            🔀 Cambiar Imagen
                        </button>
                        <button class="btn btn-dark py-2.5 fw-semibold border-secondary text-start" onclick="cambiarTamano()">
                            📐 Cambiar Tamaño
                        </button>
                    </div>
                </div>
            </div>

            <!-- COLUMNA DERECHA: Área de Trabajo / Vista Previa -->
            <div class="col-12 col-md-8 col-lg-9">
                <div class="card p-4 h-100 border-0 shadow-sm bg-body d-flex flex-column align-items-center justify-content-center text-center workspace-area">
                    
                    <!-- El texto/H1 ahora vive acá dentro -->
                    <h1 id="titulo" class="mb-4 fs-2 fs-md-1 fw-bold tracking-tight">
                        Presioná un botón
                    </h1>
                    
                    <!-- El contenedor de la imagen -->
                    <div id="contenedorImagen" class="w-100 d-flex justify-content-center align-items-center"></div>
                    
                </div>
            </div>

        </div>
    </div>

<script src="scripts/script.js"></script>
</body>
</html>
