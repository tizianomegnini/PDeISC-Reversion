<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Resultados</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container py-4">

    <!-- El botón mide solo lo que ocupa su contenido y se centra en móvil -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <h1 class="text-center text-md-start">Resultados</h1>
        <button id="toggleTema" class="btn btn-dark align-self-center align-self-md-auto">
            🌙 Modo Oscuro
        </button>
    </div>

    <!-- TABLA -->
    <div class="table-responsive">
        <table class="table table-bordered table-hover text-center align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Ejercicio</th>
                    <th>Operación</th>
                    <th>Resultado</th>
                </tr>
            </thead>
            <tbody id="tabla-body"></tbody>
        </table>
    </div>

</div>

<!-- BOTÓN VOLVER ARRIBA -->
<button id="btnTop" class="btn btn-secondary">
    ↑
</button>

<script src="/scripts/main.js" defer></script>
</body>
</html>
